<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F3FA">
<title>Vertigo</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F3FA; --surf:#FFFFFF; --surf2:#EFEDF9; --line:#E4E1F0;
  --brand:#5B54B8;                     /* périwinkle profond : le nom, les titres */
  --red:#D97583;                       /* rose poudré : accent principal */
  --cyan:#5AA6A0;                      /* eucalyptus : chiffres, quantités */
  --lime:#8AA86B;                       /* sauge : calories, réussite */
  --text:#2C2839; --muted:#837D97; --ok:#6FAE8C;
  --shadow:0 2px 10px rgba(60,50,110,.055);
  --shadow-l:0 6px 22px rgba(60,50,110,.09);
  --disp:'Bricolage Grotesque',-apple-system,'Segoe UI',sans-serif;
  --body:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);
  overscroll-behavior-y:none;}
body{min-height:100vh;}
button{font-family:inherit;color:inherit;}

/* ---------- ACCUEIL ---------- */
#home{min-height:100vh;padding:calc(env(safe-area-inset-top) + 8px) 18px calc(env(safe-area-inset-bottom) + 28px);
  position:relative;overflow:hidden;}
#web{position:absolute;top:-40px;left:50%;transform:translateX(-50%);width:190%;max-width:760px;
  opacity:.75;pointer-events:none;}
.hero{position:relative;text-align:center;padding-top:26px;}
.hero img{width:88px;filter:drop-shadow(0 6px 16px rgba(91,84,184,.22));
  animation:drop .9s cubic-bezier(.2,.8,.2,1) both;}
@keyframes drop{from{transform:translateY(-26px);opacity:0}to{transform:none;opacity:1}}
.hero h1{font-family:var(--disp);font-size:clamp(46px,16vw,70px);margin:12px 0 0;
  letter-spacing:-2px;line-height:.88;text-transform:uppercase;color:var(--brand);
  font-weight:800;}
.tag{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:2.2px;
  text-transform:uppercase;margin:6px 0 0;}

/* jauge + poids */
.dash{position:relative;display:flex;align-items:center;gap:16px;background:var(--surf);
  border:1px solid var(--line);border-radius:22px;padding:17px;margin:22px 0 18px;
  box-shadow:var(--shadow-l);}
.ring{position:relative;width:82px;height:82px;flex-shrink:0;}
.ring svg{transform:rotate(-90deg);}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:18px;font-weight:700;}
.dash .kg{font-family:var(--disp);font-size:38px;line-height:.95;letter-spacing:-1.2px;color:var(--brand);}
.dash .kg small{font-size:16px;color:var(--muted);}
.dash .lbl{font-family:var(--mono);font-size:10px;color:var(--muted);
  letter-spacing:1.6px;text-transform:uppercase;margin:0 0 2px;}
.dash .togo{font-family:var(--mono);font-size:12px;color:var(--red);margin:6px 0 0;font-weight:500;}

/* menu */
.menu{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.tile{background:var(--surf);border:1px solid var(--line);border-radius:20px;
  padding:16px 15px;text-align:left;position:relative;overflow:hidden;
  transition:transform .14s,box-shadow .14s;display:block;width:100%;
  box-shadow:var(--shadow);}
.tile:active{transform:scale(.96);box-shadow:var(--shadow-l);}
.tile.wide{grid-column:span 2;display:flex;align-items:center;gap:14px;}
.tile .ic{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;margin-bottom:10px;}
.tile.wide .ic{margin:0;}
.tile .ic svg{width:19px;height:19px;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.tile h3{font-family:var(--disp);font-size:18px;margin:0;letter-spacing:-.4px;font-weight:700;color:var(--text);}
.tile p{font-family:var(--mono);font-size:11px;color:var(--muted);margin:3px 0 0;}
.tile .arrow{position:absolute;right:14px;bottom:14px;color:var(--muted);opacity:.5;font-size:15px;}
.tile.wide .arrow{position:static;margin-left:auto;}

/* ---------- SECTIONS ---------- */
#page{display:none;min-height:100vh;padding-bottom:40px;}
.top{position:sticky;top:0;z-index:20;background:rgba(244,243,250,.88);
  backdrop-filter:blur(16px);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:12px;}
.back{background:var(--surf);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.back svg{width:17px;height:17px;stroke:var(--text);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.top h2{font-family:var(--disp);font-size:22px;margin:0;letter-spacing:-.8px;font-weight:800;color:var(--brand);}
.top .pc{margin-left:auto;font-family:var(--mono);font-size:13px;font-weight:500;color:var(--cyan);}
.wrap{padding:16px 14px;max-width:560px;margin:0 auto;}
.note{font-family:var(--mono);font-size:11px;color:var(--muted);margin:0 0 14px;line-height:1.5;}

.card{background:var(--surf);border:1px solid var(--line);border-radius:18px;
  overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow);}
.chead{background:var(--surf2);padding:13px 15px;display:flex;justify-content:space-between;
  align-items:center;gap:10px;font-family:var(--disp);font-size:15px;letter-spacing:-.3px;
  font-weight:700;color:var(--text);}
.chead.now{background:linear-gradient(90deg,color-mix(in srgb,var(--red) 16%,var(--surf)),var(--surf2));
  border-left:3px solid var(--red);}
.chead .pl{font-family:var(--mono);color:var(--muted);font-size:15px;font-weight:700;}
.row{display:flex;gap:12px;padding:11px 14px;border-top:1px solid var(--line);align-items:flex-start;}
.box{width:21px;height:21px;border-radius:7px;border:2px solid var(--line);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;margin-top:1px;transition:.15s;}
.box.on{background:var(--ok);border-color:var(--ok);}
.box.on::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2.5px 2.5px 0;
  transform:rotate(45deg) translate(-1px,-1px);}
.done{text-decoration:line-through;color:var(--muted);}
.grow{flex:1;min-width:0;}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.nm{font-size:14px;line-height:1.45;}
.qty{font-family:var(--mono);font-size:11px;color:var(--cyan);white-space:nowrap;}
.kcal{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;}
.mtype{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--red);
  letter-spacing:1.4px;text-transform:uppercase;}
.total{background:var(--surf2);padding:13px 15px;display:flex;justify-content:space-between;
  font-family:var(--disp);font-size:15px;letter-spacing:-.3px;font-weight:700;
  border-top:1px solid var(--line);}
.total span:last-child{font-family:var(--mono);color:var(--lime);}
.exline{font-family:var(--mono);font-size:12.5px;padding:5px 14px;line-height:1.5;color:var(--text);}
.exline.hd{color:var(--cyan);font-weight:700;}
.ex{padding:0 14px 15px;}
.ex p{font-size:14px;line-height:1.6;margin:12px 0 0;}
.ex .tip{font-family:var(--mono);font-size:12px;color:var(--lime);margin-top:10px;line-height:1.5;}
.cat{font-family:var(--disp);font-size:15px;letter-spacing:-.3px;font-weight:700;
  color:var(--brand);margin:22px 0 10px;padding-left:2px;}
.cat:first-child{margin-top:4px;}
.duration{font-family:var(--mono);font-size:11px;color:var(--muted);}
.sess{font-family:var(--body);font-size:13px;text-transform:none;letter-spacing:0;
  font-weight:400;color:var(--muted);margin-top:3px;display:block;}

.wbar{display:flex;gap:9px;margin-bottom:14px;}
input{flex:1;min-width:0;background:var(--surf);border:1px solid var(--line);color:var(--text);
  border-radius:14px;padding:13px;font-family:var(--mono);font-size:15px;outline:none;
  box-shadow:var(--shadow);}
input:focus{border-color:var(--red);}
input::placeholder{color:var(--muted);}
.addb{background:var(--brand);border:none;border-radius:14px;padding:0 20px;
  font-family:var(--disp);font-size:16px;letter-spacing:-.3px;font-weight:700;color:#fff;}
.chart{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:14px 8px;
  margin-bottom:12px;box-shadow:var(--shadow);}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:12px;}
.stat{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:15px;
  text-align:center;box-shadow:var(--shadow);}
.stat b{display:block;font-family:var(--disp);font-size:23px;letter-spacing:-.8px;font-weight:800;}
.stat span{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase;}
.del{background:none;border:none;color:var(--muted);font-size:15px;padding:0 2px;}
ul.plain{margin:0;padding:0;list-style:none;}

/* ---- liste de courses type Bring! ---- */
.chips{display:flex;flex-wrap:wrap;gap:9px;}
.chip{background:var(--surf);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);
  padding:10px 12px;display:flex;align-items:center;gap:9px;text-align:left;
  transition:transform .1s,border-color .12s,opacity .12s;max-width:100%;}
.chip:active{transform:scale(.94);}
.chip .cn{font-size:13.5px;font-weight:500;line-height:1.2;}
.chip .cq{font-family:var(--mono);font-size:10px;color:var(--muted);display:block;margin-top:2px;}
.chip.on{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surf));}
.chip.on .cn{text-decoration:line-through;color:var(--muted);}
.chip .tick{width:19px;height:19px;border-radius:6px;border:2px solid var(--line);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;}
.chip.on .tick{background:var(--ok);border-color:var(--ok);}
.chip.on .tick::after{content:"";width:4px;height:8px;border:solid #fff;
  border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px);}
.chip .x{background:none;border:none;color:var(--muted);font-size:15px;padding:0 0 0 2px;line-height:1;}
.chip.add{border-style:dashed;color:var(--muted);}
.chip.add.in{opacity:.32;}
.chip.add .plus{color:var(--cyan);font-size:15px;line-height:1;font-weight:700;}
.sechead{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 11px;}
.sechead h3{font-family:var(--disp);font-size:18px;letter-spacing:-.5px;
  font-weight:800;margin:0;color:var(--brand);}
.sechead span{font-family:var(--mono);font-size:11px;color:var(--muted);}
.sechead:first-child{margin-top:0;}
.empty{background:var(--surf);border:1px dashed var(--line);border-radius:18px;
  padding:22px 16px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6;}
.mini{background:var(--surf);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  padding:9px 13px;font-family:var(--mono);font-size:11px;color:var(--muted);
  letter-spacing:.8px;text-transform:uppercase;}
.mini:active{border-color:var(--red);}
.catname{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:1.6px;
  text-transform:uppercase;margin:16px 0 9px;}

/* ---- profil ---- */
.field{margin-bottom:15px;}
.field>label{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);
  letter-spacing:1.6px;text-transform:uppercase;margin-bottom:7px;}
.field input{width:100%;}
.seg{display:flex;gap:7px;flex-wrap:wrap;}
.seg button{flex:1;min-width:64px;background:var(--surf);border:1px solid var(--line);
  color:var(--muted);border-radius:12px;padding:11px 8px;font-size:13px;font-weight:500;
  transition:.12s;}
.seg button.on{background:color-mix(in srgb,var(--brand) 13%,var(--surf));
  border-color:var(--brand);color:var(--brand);font-weight:700;}
.seg button:active{transform:scale(.96);}
.seg.col{flex-direction:column;}
.seg.col button{flex:none;text-align:left;min-width:0;}
.seg .sub{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:3px;}
.res{background:var(--surf);border:1px solid var(--line);border-radius:20px;
  padding:19px;margin:6px 0 14px;box-shadow:var(--shadow-l);}
.res .big{font-family:var(--disp);font-size:42px;line-height:1;letter-spacing:-1.5px;
  font-weight:800;color:var(--lime);}
.res .big small{font-size:15px;color:var(--muted);letter-spacing:0;}
.res .lbl{font-family:var(--mono);font-size:10px;color:var(--muted);
  letter-spacing:1.6px;text-transform:uppercase;margin:0 0 4px;}
.res hr{border:none;border-top:1px solid var(--line);margin:15px 0;}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;}
.kv span:last-child{font-family:var(--mono);font-weight:700;}
.warn{background:color-mix(in srgb,var(--red) 9%,var(--surf));border:1px solid var(--red);
  border-radius:16px;padding:13px 15px;font-size:12.5px;line-height:1.6;margin-bottom:12px;}
.warn b{color:var(--red);}
.info{background:var(--surf);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  padding:13px 15px;font-size:12.5px;line-height:1.6;color:var(--muted);margin-bottom:12px;}
.savebar{position:sticky;bottom:0;background:linear-gradient(rgba(244,243,250,0),var(--bg) 28%);
  padding:18px 0 calc(env(safe-area-inset-bottom) + 10px);}
.save{width:100%;background:var(--brand);border:none;border-radius:16px;padding:16px;
  font-family:var(--disp);font-size:18px;letter-spacing:-.4px;font-weight:800;color:#fff;
  box-shadow:0 4px 14px rgba(91,84,184,.28);}
.save:active{transform:scale(.98);}
.banner{background:color-mix(in srgb,var(--red) 10%,var(--surf));
  border:1px solid var(--red);border-radius:20px;padding:15px 16px;margin:0 0 16px;
  box-shadow:var(--shadow);
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;}
.banner h4{font-family:var(--disp);font-size:16px;margin:0;letter-spacing:-.3px;font-weight:700;}
.banner p{font-family:var(--mono);font-size:11px;color:var(--muted);margin:3px 0 0;}

.rayon{display:flex;justify-content:space-between;align-items:center;
  font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:1.4px;
  text-transform:uppercase;margin:18px 0 9px;padding-bottom:6px;
  border-bottom:1px solid var(--line);}
.rayon .cnt{letter-spacing:0;color:var(--cyan);}
.sechead + .rayon{margin-top:2px;}

.months{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin:0 -14px 0;
  padding-left:14px;padding-right:14px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.months::-webkit-scrollbar{display:none;}
.mo{flex:0 0 auto;background:var(--surf);border:1px solid var(--line);color:var(--muted);
  border-radius:11px;padding:9px 13px;font-family:var(--mono);font-size:11px;
  letter-spacing:.6px;text-transform:uppercase;transition:.12s;}
.mo.on{background:color-mix(in srgb,var(--lime) 18%,var(--surf));border-color:var(--lime);
  color:var(--lime);font-weight:500;}
.mo:active{transform:scale(.94);}
.seasontag{font-family:var(--mono);font-size:11px;color:var(--lime);letter-spacing:1.2px;
  text-transform:uppercase;margin:4px 0 12px;}

/* ---- éditeur de repas ---- */
.pill{display:inline-block;background:color-mix(in srgb,var(--lime) 22%,transparent);
  color:var(--lime);font-family:var(--mono);font-size:9px;letter-spacing:1.2px;
  text-transform:uppercase;padding:2px 6px;border-radius:5px;margin-left:7px;vertical-align:1px;}
.edit{background:var(--surf2);border:1px solid var(--line);color:var(--cyan);
  border-radius:9px;padding:5px 10px;font-family:var(--mono);font-size:10px;
  letter-spacing:1px;text-transform:uppercase;}
.edit:active{border-color:var(--cyan);}
.ing{background:var(--surf);border:1px solid var(--line);border-radius:16px;
  padding:13px 14px;margin-bottom:9px;box-shadow:var(--shadow);}
.gram{display:flex;align-items:center;gap:6px;margin-top:10px;}
.gram button{background:var(--surf2);border:1px solid var(--line);color:var(--text);
  border-radius:9px;padding:7px 8px;font-family:var(--mono);font-size:11px;flex-shrink:0;}
.gram button:active{border-color:var(--red);transform:scale(.93);}
.gram input.gi{width:58px;flex:none;text-align:center;padding:8px 4px;font-size:14px;
  border-radius:9px;}
.gram .unit{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:-2px;}
.gram .ikc{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--lime);
  white-space:nowrap;}
.rowbtn{display:flex;gap:9px;flex-wrap:wrap;padding:12px 14px;}
.alert{background:color-mix(in srgb,var(--red) 14%,var(--surf));border-top:1px solid var(--red);
  padding:11px 14px;font-size:12.5px;line-height:1.55;color:var(--text);}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);
  background:var(--text);border:1px solid var(--text);color:#fff;box-shadow:var(--shadow-l);
  padding:12px 18px;border-radius:13px;font-size:13px;opacity:0;pointer-events:none;
  transition:.25s;z-index:60;max-width:90%;text-align:center;}
#toast.show{opacity:1;transform:translate(-50%,0);}

.toggle{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  background:var(--surf);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
  padding:14px 15px;margin-bottom:13px;transition:.15s;}
.toggle.on{border-color:var(--lime);
  background:linear-gradient(135deg,color-mix(in srgb,var(--lime) 13%,var(--surf)),var(--surf));}
.toggle .sw{width:42px;height:24px;border-radius:99px;background:var(--line);
  flex-shrink:0;position:relative;transition:.18s;}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;
  border-radius:50%;background:var(--muted);transition:.18s;}
.toggle.on .sw{background:color-mix(in srgb,var(--lime) 45%,var(--surf));}
.toggle.on .sw::after{left:21px;background:var(--lime);}
.toggle b{display:block;font-size:14px;font-weight:700;}
.toggle .state{font-family:var(--disp);font-size:14px;letter-spacing:.5px;font-weight:700;
  color:var(--muted);flex-shrink:0;padding:5px 9px;border-radius:8px;
  border:1px solid var(--line);}
.toggle.on .state{color:var(--lime);border-color:var(--lime);
  background:color-mix(in srgb,var(--lime) 15%,transparent);}
.toggle em{display:block;font-family:var(--mono);font-size:10.5px;color:var(--muted);
  font-style:normal;margin-top:3px;line-height:1.4;}
.dot{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;
  border-radius:4px;font-size:9px;font-weight:700;margin-right:6px;vertical-align:1px;}
.dot.ok{background:color-mix(in srgb,var(--ok) 25%,transparent);color:var(--ok);}
.dot.no{background:color-mix(in srgb,var(--red) 22%,transparent);color:var(--red);}
.nm.missing{color:var(--muted);}

.daynav{display:flex;align-items:center;justify-content:space-between;
  background:var(--surf);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  padding:8px 10px;margin-bottom:13px;}
.daynav span{font-family:var(--disp);font-size:17px;letter-spacing:-.4px;font-weight:700;color:var(--brand);}
.daynav button{background:var(--surf2);border:1px solid var(--line);color:var(--text);
  width:34px;height:34px;border-radius:10px;font-size:17px;}
.daynav button:disabled{opacity:.3;}
.hero-tile{border-color:var(--cyan);
  background:color-mix(in srgb,var(--cyan) 9%,var(--surf));box-shadow:var(--shadow-l);}
.hero-tile h3{font-size:19px;color:var(--brand);}

.week{position:relative;background:var(--surf);border:1px solid var(--line);

.wk-t{font-family:var(--disp);font-size:17px;font-weight:800;letter-spacing:-.4px;color:var(--brand);}

.wk-bars{display:flex;gap:6px;align-items:flex-end;}
.wk-d{flex:1;background:none;border:none;padding:0;display:flex;flex-direction:column;

.wk-bar{width:100%;height:74px;background:var(--surf2);border-radius:8px;

.wk-fill{width:100%;border-radius:8px;transition:height .35s cubic-bezier(.2,.8,.2,1);}
.wk-fill.ok{background:var(--lime);}
.wk-fill.over{background:var(--red);}
.wk-fill.under{background:var(--cyan);opacity:.65;}
.wk-fill.none{background:transparent;}
.wk-d em{font-family:var(--mono);font-size:10px;color:var(--muted);font-style:normal;}
.wk-d i{font-family:var(--mono);font-size:9.5px;color:var(--muted);font-style:normal;opacity:.75;}
.wk-d.now em{color:var(--brand);font-weight:500;}
.wk-d.now .wk-bar{outline:1.5px solid var(--brand);outline-offset:1.5px;}
.wk-d:active{transform:scale(.93);}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

/* choix stable : même jour + même repas = même produit */
function pick(pool,seed){
  let hsh=0; for(let i=0;i<seed.length;i++) hsh=(hsh*31+seed.charCodeAt(i))|0;
  return pool[Math.abs(hsh)%pool.length];
}
const gramsOf=q=>{ const m=/(\d+)\s*g/.exec(q||""); return m?+m[1]:null; };

/* remplace fruits / légumes / poissons par les produits du mois choisi */
function seasonize(it,seed){
  const low=it.n.toLowerCase(), M=SEASON[month];
  let pool=null;
  if(/banane|fruits? rouges?|myrtille|^fruit/.test(low)) pool=M.f;
  else if(/légume|brocoli|haricot vert|courgette|salade|crudité/.test(low)) pool=M.l;
  else if(/poisson|saumon/.test(low) && !/ou /.test(low)) pool=M.p;
  if(!pool) return it;
  const ch=pick(pool,seed+month), g=gramsOf(it.q);
  const cru=/\(cru/.test(it.n)?" (cru)":"";
  return {n:ch[0]+cru, q:it.q, k: g?Math.round(g*ch[1]/100):it.k};
}
function mealItems(d,i){
  const base=MEALS[d][i].items.map((it,j)=>seasonize(it,d+i+j));
  if(!adapt) return base;
  const ST=stock(), used=new Set();
  return base.map((it,j)=>useStock(it,d+i+j,ST,used));
}

/* index de recherche */
const norm=t=>t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/œ/g,"oe").replace(/æ/g,"ae");
/* découpe en mots comparables (pluriels et ponctuation neutralisés) */
function toks(t){
  return norm(t).replace(/\(.*?\)/g," ").replace(/[^a-z0-9]+/g," ").trim()
    .split(" ").filter(w=>w.length>2)
    .map(w=>w.length>3&&w.endsWith("s")?w.slice(0,-1):w);
}
const flat=t=>norm(t).replace(/[^a-z0-9]+/g," ").trim();
const FOOD=FOODS.map((f,i)=>({i,n:f[0],k:f[1],p:f[2],g:f[3],l:f[4],c:f[5],
  s:norm(f[0]),f:flat(f[0]),w:toks(f[0])}));
function searchFood(q){
  const n=flat(q);
  if(!n) return FOOD.slice(0,40);
  const words=n.split(" ");
  return FOOD
    .map(f=>{
      if(f.f.startsWith(n)) return {f,s:3};
      if(f.f.includes(n)) return {f,s:2};
      if(words.every(w=>f.f.includes(w))) return {f,s:1};
      return null;
    })
    .filter(Boolean).sort((a,b)=>b.s-a.s).slice(0,40).map(x=>x.f);
}
/* termes génériques du plan → aliment de référence */
const SYN={"poisson blanc":"Cabillaud","poisson":"Cabillaud","poisson gras":"Saumon frais",
  "crudite":"Salade verte","fruit":"Pomme","legume":"Courgette","legume vert":"Haricot vert",
  "boeuf ou poisson":"Steak haché 5%","boeuf":"Steak haché 5%","boeuf maigre":"Steak haché 5%",
  "viande":"Blanc de poulet","salade":"Salade verte","pain":"Pain complet",
  "shake":"Whey protéine","fromage":"Emmental","yaourt":"Yaourt nature"};

/* correspondance par mots entiers, du plus précis au plus large */
function findFood(name){
  const w=toks(name);
  const sy=SYN[w.join(" ")];
  if(sy) return FOOD.find(f=>f.n===sy)||null;
  if(!w.length) return null;
  const joined=w.join(" ");
  let best=null, score=0;
  FOOD.forEach(f=>{
    let sc=0;
    const fj=f.w.join(" ");
    if(fj===joined) sc=100;
    else if(fj.startsWith(joined)||joined.startsWith(fj)) sc=80;
    else{
      const common=f.w.filter(x=>w.includes(x)).length;
      if(common) sc=40+common*12-Math.abs(f.w.length-w.length)*2;
    }
    if(sc>score){ score=sc; best=f; }
  });
  return score>=40?best:null;
}

/* quantité proposée quand on ajoute l'aliment */
function defaultG(n){
  const u=unitOf(n);
  if(u.def) return toG(u.def,u);
  if(u.t==="u") return toG(1,u);
  if(u.t==="cl") return toG(10,u);
  const f=FOOD.find(x=>x.n===n);
  if(f&&f.k>=500) return 20;      // oléagineux, purées : portion réaliste
  if(f&&f.k>=300) return 60;      // féculents secs, fromages
  return 100;
}
const unitOf=n=>UNITS[n]||{t:"g"};
const perUnit=u=>u.t==="u"?u.w:u.t==="cl"?u.d*10:1;   // grammes pour 1 unité affichée

/* grammes → valeur affichée */
function disp(g,u){
  const p=perUnit(u);
  if(u.t==="u"){ const v=Math.round(g/p*2)/2; return v<0.5?0.5:v; }
  if(u.t==="cl") return Math.max(1,Math.round(g/p));
  return Math.round(g);
}
/* nom de l'unité : quartier, tranche, part… selon l'aliment */
function unitName(v,u){
  if(u.t==="cl") return "cl";
  if(u.t!=="u") return "g";
  const n=u.lbl||"unité";
  return v>1?(n==="unité"?"unités":n+"s"):n;
}
const unitLbl=(v,u)=>" "+unitName(v,u);
const dispQ=x=>{ const u=unitOf(x.n), v=disp(x.g,u); return v+unitLbl(v,u); };
/* valeur affichée → grammes */
const toG=(v,u)=>Math.max(1,Math.round(v*perUnit(u)));



/* ---------- SYNCHRONISER LA LISTE AVEC LES REPAS ---------- */
/* tous les ingrédients nécessaires sur les 7 jours */
function needed(){
  const out=new Map();
  DAYS.forEach(d=>{
    const r=dayInfo(d).r;
    MEALS[d].forEach((m,i)=>{
      if(meals[mkey(d,i)]) return;          // déjà mangé : plus besoin de l'acheter
      const mo=mealOf(d,i);
      mo.items.forEach(x=>{
        const nm=x.n.replace(/\s*\(crue?s?\)/,"").trim();
        if(!out.has(norm(nm))) out.set(norm(nm),{n:nm,q:mo.custom?x.q:scaleQ(x.q,r)});
      });
    });
  });
  return out;
}
/* ce qui traîne dans la liste sans servir à aucun repas (hors ajouts perso) */
function unusedItems(){
  const need=needed();
  return list.filter(x=>x.o!=="user"&&!x.done&&!need.has(norm(x.n)));
}
/* nombre de repas déjà cochés sur la semaine */
const eatenCount=()=>DAYS.reduce((s,d)=>s+MEALS[d].filter((m,i)=>meals[mkey(d,i)]).length,0);
function syncList(){
  const need=needed();
  let add=0;
  need.forEach((v,k)=>{
    if(!list.some(x=>norm(x.n)===k)){
      const f=findFood(v.n);
      list.push({id:"s"+Date.now()+Math.random().toString(36).slice(2,5),
        n:v.n,q:v.q,c:f?f.c:"Divers",o:"plan",done:false});
      add++;
    }
  });
  S.set("list",list);
  return add;
}


/* ingrédients nécessaires pour un seul jour */
function neededDay(d){
  const out=new Map(), r=dayInfo(d).r;
  MEALS[d].forEach((m,i)=>{
    if(meals[mkey(d,i)]) return;            // repas déjà mangé
    const mo=mealOf(d,i);
    mo.items.forEach(x=>{
      const nm=x.n.replace(/\s*\(crue?s?\)/,"").trim();
      if(!out.has(norm(nm))) out.set(norm(nm),{n:nm,q:mo.custom?x.q:scaleQ(x.q,r)});
    });
  });
  return out;
}
/* appelé dès qu'un repas change : la liste suit sans rien demander */
function autoSync(d){
  const all=needed(), day=neededDay(d);
  let add=0, rm=0;
  /* on retire les ingrédients ajoutés automatiquement qui ne servent plus nulle part
     (jamais les ajouts perso, jamais ce qui est déjà coché « pris ») */
  list=list.filter(x=>{
    if(x.o!=="auto"||x.done||all.has(norm(x.n))) return true;
    rm++; return false;
  });
  day.forEach((v,k)=>{
    if(list.some(x=>norm(x.n)===k)) return;
    const f=findFood(v.n);
    list.push({id:"a"+Date.now()+Math.random().toString(36).slice(2,5),
      n:v.n,q:v.q,c:f?f.c:"Divers",o:"auto",done:false});
    add++;
  });
  S.set("list",list);
  return {add,rm};
}

/* ---------- JOURNAL : CE QUE J'AI VRAIMENT MANGÉ ---------- */
let log=S.get("log",{});
const iso=d=>d.toISOString().slice(0,10);
let logDate=iso(new Date());
const dayLog=()=>log[logDate]||[];
function saveLog(a){ if(a.length) log[logDate]=a; else delete log[logDate]; S.set("log",log); }
function logAdd(name,g,src,date){
  const f=FOOD.find(x=>x.n===name);
  if(!f) return;
  const d=date||logDate;
  const a=(log[d]||[]).slice();
  a.push({n:f.n,g,k:f.k,p:f.p,gl:f.g,l:f.l,src:src||""});
  log[d]=a; S.set("log",log);
}

/* ---- semaine en cours ---- */
function weekStart(){
  const d=new Date(); d.setHours(12,0,0,0);
  d.setDate(d.getDate()-((d.getDay()+6)%7));
  return d;
}
function weekDates(){
  const s=weekStart();
  return DAYS.map((_,i)=>{ const d=new Date(s); d.setDate(s.getDate()+i); return iso(d); });
}
const dateOfDay=n=>weekDates()[DAYS.indexOf(n)];
const kcalOfDate=d=>Math.round(logTotals(log[d]||[]).k);

/* cocher un repas = l'enregistrer dans le journal du bon jour */
function toggleMealLog(d,i){
  const key=mkey(d,i), date=dateOfDay(d), on=!meals[key];
  meals[key]=on; S.set("meals",meals);
  if(on){
    const r=dayInfo(d).r, mo=mealOf(d,i);
    mo.items.forEach(x=>{
      const nm=x.n.replace(/\s*\(crue?s?\)/,"").trim();
      const f=findFood(nm);
      const g=gramsOf(mo.custom?x.q:scaleQ(x.q,r))||100;
      if(f) logAdd(f.n,g,key,date);
    });
  }else{
    const a=(log[date]||[]).filter(x=>x.src!==key);
    if(a.length) log[date]=a; else delete log[date];
    S.set("log",log);
  }
}
function logTotals(a){
  a=a||dayLog();
  return a.reduce((t,x)=>({
    k:t.k+x.g*x.k/100, p:t.p+x.g*x.p/100,
    g:t.g+x.g*x.gl/100, l:t.l+x.g*x.l/100
  }),{k:0,p:0,g:0,l:0});
}
/* aliments récemment enregistrés, pour l'ajout en un geste */
function recents(){
  const seen=[], out=[];
  Object.keys(log).sort().reverse().forEach(d=>
    (log[d]||[]).slice().reverse().forEach(x=>{
      if(!seen.includes(x.n)&&out.length<10){ seen.push(x.n); out.push(x.n); }
    }));
  return out;
}

/* un article coché "pris" dans la liste = disponible à la maison */
function stock(){
  const out={};
  list.filter(x=>x.done).forEach(it=>{
    const f=findFood(it.n);
    const cat=f?f.c:catOf(it);
    if(cat==="Divers") return;
    (out[cat]=out[cat]||[]).push({n:f?f.n:it.n, k:f?f.k:null});
  });
  return out;
}
const stockCount=()=>list.filter(x=>x.done).length;

/* remplace un ingrédient par un équivalent déjà acheté du même rayon */
function useStock(it,seed,ST,used){
  const f=findFood(it.n);
  const cat=f?f.c:null;
  if(!cat||cat==="Épicerie") return it;               // huiles, épices : on garde
  const pool=ST[cat];
  if(!pool||!pool.length) return Object.assign({},it,{miss:true});
  const ref=norm(f?f.n:it.n);
  if(pool.some(p=>norm(p.n)===ref)){ used.add(ref); return Object.assign({},it,{ok:true}); }
  /* on évite de répéter le même aliment dans un repas */
  const free=pool.filter(p=>!used.has(norm(p.n)));
  const ch=pick(free.length?free:pool,seed), g=gramsOf(it.q);
  used.add(norm(ch.n));
  return {n:ch.n, q:it.q, ok:true,
    k:(ch.k!=null&&g)?Math.round(g*ch.k/100):it.k};
}

/* ---------- REPAS PERSONNALISÉS ---------- */
let custom=S.get("custom",{});
const mkey=(d,i)=>d+"-"+i;
const itemKcal=x=>Math.round(x.g*x.k/100);

/* repas affiché : version perso si elle existe, sinon le plan de saison */
function mealOf(d,i){
  const cu=custom[mkey(d,i)];
  if(cu) return {custom:true, items:cu.map(x=>({n:x.n,q:dispQ(x),k:itemKcal(x)})), raw:cu};
  return {custom:false, items:mealItems(d,i)};
}
const sumK=a=>a.reduce((s,x)=>s+(x.k||0),0);

/* équilibrage : les repas non modifiés absorbent le reste de la journée */
function dayInfo(d){
  const c=calc();
  let fixed=0, rest=0, nCustom=0;
  MEALS[d].forEach((m,i)=>{
    const mo=mealOf(d,i), k=sumK(mo.items);
    if(mo.custom){ fixed+=k; nCustom++; } else rest+=k;
  });
  const target=c?c.target:fixed+rest;
  let r = rest>0 ? (target-fixed)/rest : 1;
  const raw=r;
  r=Math.max(0.3,Math.min(2.5,r));
  return {target,fixed,rest,r,nCustom,tight:raw<0.45,over:raw>2.4,all:nCustom===MEALS[d].length};
}

const DEF_PROFILE={sex:"H",age:null,height:174,start:82,weight:82,goal:75,rate:0.5,act:1.55};

];

const profileOK=()=>!!(P.age&&P.height&&P.weight);

/* poids sain minimum (IMC 18,5) et maximum (IMC 25) */
const minHealthy=()=>+(18.5*Math.pow(P.height/100,2)).toFixed(1);
const maxHealthy=()=>+(25*Math.pow(P.height/100,2)).toFixed(1);

function calc(){
  const w=P.weight, h=P.height, a=P.age;
  if(!profileOK()) return null;
  const bmr=Math.round(10*w+6.25*h-5*a+(P.sex==="H"?5:-161));
  const tdee=Math.round(bmr*P.act);
  const warns=[];

  /* objectif borné à une fourchette de poids saine */
  let goal=P.goal, lo=minHealthy();
  if(goal<lo){ goal=lo; warns.push(`Objectif ramené à ${lo} kg : en dessous, tu passerais sous un IMC de 18,5, ce qui n'est pas un poids sain pour ta taille.`); }

  const losing=goal<w;
  let rate=Math.min(P.rate, losing?1:0.5);
  const daily=Math.round(rate*7700/7);
  let target=losing?tdee-daily:tdee+daily;

  /* plancher de sécurité : jamais sous le métabolisme de base, ni sous 1500/1200 kcal */
  const floor=Math.max(bmr, P.sex==="H"?1500:1200);
  if(target<floor){
    warns.push(`Calories relevées à ${floor} kcal : descendre plus bas t'exposerait à des carences, une fonte musculaire et une grosse fatigue.`);
    target=floor;
  }

  const diff=Math.abs(w-goal);
  const weeks=rate?Math.ceil(diff/rate):0;
  const end=new Date(); end.setDate(end.getDate()+weeks*7);
  const prot=Math.round(w*(losing?2.0:1.8));
  const fat=Math.round(target*0.25/9);
  const carb=Math.round((target-prot*4-fat*9)/4);

  return {bmr,tdee,target,goal,rate,daily,losing,weeks,end,prot,fat,carb,warns,floor};
}

/* ---------- adaptation des portions ---------- */
function ratio(d){ return dayInfo(d).r; }
function scaleQ(q,r){
  if(r===1||!q||/volonté|appétit|normale/i.test(q)) return q;
  return q.replace(/\d+([.,]\d+)?/g,(m,_,off,str)=>{
    const n=parseFloat(m.replace(",","."));
    const after=q.slice(off+m.length,off+m.length+3);
    const v=n*r;
    if(/^\s*g/.test(after)) return v>=25?String(Math.round(v/5)*5):String(Math.round(v));
    return String(Math.max(1,Math.round(v)));
  });
}
const scaleK=(k,r)=>Math.round(k*r/5)*5;

function kcalOf(d,i,r){
  const mo=mealOf(d,i);
  if(mo.custom) return sumK(mo.items);
  return mo.items.reduce((s,x)=>s+scaleK(x.k||0,r===undefined?1:r),0);
}
const dayKcal=d=>{ const r=ratio(d); return MEALS[d].map((m,i)=>kcalOf(d,i,r)).reduce((a,b)=>a+b,0); };

}

function chartSVG(){
  const W=320,H=180,pad={l:32,r:12,t:14,b:24};
  const pts=[{d:"Départ",w:P.start}].concat(weights.map(x=>({d:x.date.slice(5),w:x.weight})));
  const G=(calc()||{}).goal||P.goal;
  const mx=Math.max(P.start+1,...pts.map(p=>p.w)), mn=Math.min(G-1,...pts.map(p=>p.w));
  const X=i=>pad.l+(pts.length<2?0:i*(W-pad.l-pad.r)/(pts.length-1));
  const Y=v=>pad.t+(mx-v)/(mx-mn||1)*(H-pad.t-pad.b);
  let g="";
  [mn,(mn+mx)/2,mx].forEach(v=>{
    g+=`<line x1="${pad.l}" y1="${Y(v)}" x2="${W-pad.r}" y2="${Y(v)}" stroke="#E4E1F0"/>
        <text x="3" y="${Y(v)+4}" font-size="9" fill="#837D97" font-family="monospace">${v.toFixed(0)}</text>`;
  });
  g+=`<line x1="${pad.l}" y1="${Y(G)}" x2="${W-pad.r}" y2="${Y(G)}"
      stroke="#8AA86B" stroke-dasharray="5 4"/>
      <text x="${W-pad.r}" y="${Y(G)-5}" font-size="9" fill="#8AA86B"
      text-anchor="end" font-family="monospace">OBJECTIF ${G}</text>`;
  if(pts.length>1)
    g+=`<polyline fill="none" stroke="#D97583" stroke-width="2.6" stroke-linejoin="round"
        stroke-linecap="round" points="${pts.map((p,i)=>X(i)+","+Y(p.w)).join(" ")}"/>`;
  pts.forEach((p,i)=>{
    g+=`<circle cx="${X(i)}" cy="${Y(p.w)}" r="3.6" fill="#D97583"/>`;
    if(i===0||i===pts.length-1)
      g+=`<text x="${X(i)}" y="${H-7}" font-size="9" fill="#837D97" text-anchor="middle"
          font-family="monospace">${esc(p.d)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="180">${g}</svg>`;
}

function logResults(q){
  const r=searchFood(q);

    const g=defaultG(f.n), u=unitOf(f.n), v=disp(g,u);
    h+=`<button class="chip add" data-log="${esc(f.n)}">
      <span class="plus">+</span><span><span class="cn">${esc(f.n)}</span>
      <span class="cq">${v}${unitLbl(v,u)} · ${Math.round(g*f.k/100)} kcal</span></span></button>`;
  });
  return h+`</div>`;
}


/* les repas cochés avant l'arrivée du journal n'y figuraient pas : on les rattrape */
function migrateMeals(){
  if(S.get("migMeals",false)) return;
  Object.keys(meals).forEach(key=>{
    if(!meals[key]) return;
    const p=key.split("-"), d=p[0], i=+p[1];
    if(!MEALS[d]||!MEALS[d][i]) return;
    const date=dateOfDay(d);
    if((log[date]||[]).some(x=>x.src===key)) return;   // déjà présent
    const r=dayInfo(d).r, mo=mealOf(d,i);
    mo.items.forEach(x=>{
      const nm=x.n.replace(/\s*\(crue?s?\)/,"").trim();
      const f=findFood(nm);
      const g=gramsOf(mo.custom?x.q:scaleQ(x.q,r))||100;
      if(f) logAdd(f.n,g,key,date);
    });
  });
  S.set("migMeals",true);
}

/* ouvre l'éditeur : part du repas perso s'il existe, sinon du plan de saison */
function openEditor(d,i){
  const cu=custom[mkey(d,i)];
  let draft;
  if(cu){ draft=cu.map(x=>Object.assign({},x)); }
  else{
    const r=dayInfo(d).r;
    draft=mealItems(d,i).map(it=>{
      const f=findFood(it.n);
      const g=gramsOf(scaleQ(it.q,r));
      if(f) return {n:f.n,g:g||100,k:f.k,p:f.p,gl:f.g,l:f.l};
      const gr=g||100;
      const k100=gr?Math.round(scaleK(it.k,r)/gr*100):0;
      return {n:it.n.replace(/\s*\(crue?s?\)/,""),g:gr,k:k100,p:0,gl:0,l:0};
    });
  }
  edit={d,i,draft,q:""};
  tab="edit"; go("edit");
}

/* envoie une liste d'ingrédients vers les courses */
function toCart(items){
  let added=0;
  items.forEach(x=>{
    const nm=x.n.replace(/\s*\(crue?s?\)/,"").trim();
    if(list.some(y=>norm(y.n)===norm(nm))) return;
    const f=findFood(nm);
    list.push({id:"m"+Date.now()+Math.random().toString(36).slice(2,6),
      n:nm, q:x.q||(x.g+" g"), c:f?f.c:"Divers", o:"plan", done:false});
    added++;
  });
  S.set("list",list);
  return added;
}

document.addEventListener("click",e=>{

  if(t.id==="back"){ if(tab==="edit"){ edit=null; return go("repas"); } return goHome(); }
  if(t.dataset.go) return go(t.dataset.go);
  if(t.dataset.w){ e.stopPropagation(); workouts[t.dataset.w]=!workouts[t.dataset.w]; S.set("workouts",workouts); return refresh(); }
  if(t.dataset.tog){ const it=list.find(x=>x.id===t.dataset.tog); if(it){ it.done=!it.done; S.set("list",list); } return refresh(); }
  if(t.dataset.rm){ list=list.filter(x=>x.id!==t.dataset.rm); S.set("list",list); return refresh(); }
  if(t.dataset.add){
    if(list.some(x=>x.id===t.dataset.add)) return;
    let src=null;
    catalog().forEach(c=>c.items.forEach(i=>{ if(i.id===t.dataset.add) src=i; }));
    if(src){ let cat="Divers"; catalog().forEach(c=>c.items.forEach(i=>{ if(i.id===src.id) cat=c.category; }));
      list.push({id:src.id,n:src.name,q:src.qty,c:cat,o:"user",done:false}); S.set("list",list); }
    return refresh();
  }
  if(t.id==="gClear"){ list=list.filter(x=>!x.done); S.set("list",list); return refresh(); }
  if(t.id==="gUncheck"){ list.forEach(x=>x.done=false); S.set("list",list); return refresh(); }
  if(t.id==="gSync"){
    const n=syncList();
    return refresh(), toast(n?n+" article"+(n>1?"s":"")+" ajouté"+(n>1?"s":""):"Ta liste est déjà à jour");
  }
  if(t.id==="gPurge"){
    const un=new Set(unusedItems().map(x=>x.id));
    list=list.filter(x=>!un.has(x.id)); S.set("list",list);
    return refresh(), toast("Liste nettoyée");
  }
  if(t.id==="gReset"){
    catalog().forEach(c=>c.items.forEach(i=>{
      if(!list.some(x=>x.id===i.id)) list.push({id:i.id,n:i.name,q:i.qty,c:c.category,o:"plan",done:false});
    }));
    S.set("list",list); return refresh();
  }
  if(t.dataset.jday){ logDate=t.dataset.jday; return go("journal"); }
  if(t.dataset.log){ logAdd(t.dataset.log,defaultG(t.dataset.log)); return refresh(); }
  if(t.dataset.lrm!==undefined){ const a=dayLog().slice(); a.splice(+t.dataset.lrm,1); saveLog(a); return refresh(); }
  if(t.dataset.lg){
    const [j,dv]=t.dataset.lg.split(":"), a=dayLog().slice(), x=a[+j], u=unitOf(x.n);
    const v=disp(x.g,u)+parseFloat(dv), min=u.t==="u"?0.5:1;
    x.g=Math.max(1,Math.min(5000,toG(Math.max(min,v),u)));
    saveLog(a); return refresh();
  }
  if(t.dataset.dayMinus!==undefined||t.dataset["day-"]!==undefined){
    const step=+(t.dataset["day-"]||t.dataset.dayMinus);
    const d=new Date(logDate+"T12:00:00"); d.setDate(d.getDate()-step);
    if(iso(d)<=iso(new Date())) logDate=iso(d);
    return refresh();
  }
  if(t.dataset.logmeal){
    const [d,i]=t.dataset.logmeal.split(":");
    const was=!!meals[mkey(d,+i)];
    toggleMealLog(d,+i); refresh();
    return toast(was?"Repas retiré du journal":"Repas enregistré");
  }
  if(t.id==="adaptT"){ adapt=!adapt; S.set("adapt",adapt); return refresh(); }
  if(t.dataset.miss){
    const d=t.dataset.miss, r=dayInfo(d).r; let mi=[];
    MEALS[d].forEach((m,i)=>{ if(mealOf(d,i).custom) return;
      mealItems(d,i).forEach(x=>{ if(x.miss) mi.push({n:x.n,q:scaleQ(x.q,r)}); }); });
    const n=toCart(mi);
    return toast(n?n+" article"+(n>1?"s":"")+" ajouté"+(n>1?"s":"")+" à ta liste":"Rien ne manque");
  }
  if(t.dataset.edit){ const [dd,ii]=t.dataset.edit.split("-"); return openEditor(dd,+ii); }
  if(t.dataset.food!==undefined){
    const f=FOOD[+t.dataset.food];
    edit.draft.push({n:f.n,g:defaultG(f.n),k:f.k,p:f.p,gl:f.g,l:f.l});
    return refresh();
  }
  if(t.dataset.di!==undefined){ edit.draft.splice(+t.dataset.di,1); return refresh(); }
  if(t.dataset.g){
    const [j,dv]=t.dataset.g.split(":");
    const it=edit.draft[+j], u=unitOf(it.n);
    const v=disp(it.g,u)+parseFloat(dv);
    const min=u.t==="u"?0.5:1;
    it.g=Math.max(1,Math.min(5000,toG(Math.max(min,v),u)));
    return refresh();
  }
  if(t.dataset.savemeal){
    custom[mkey(edit.d,edit.i)]=edit.draft.map(x=>Object.assign({},x));
    S.set("custom",custom);
    const dd=edit.d; edit=null; openDay=dd;
    const r=autoSync(dd);
    go("repas");
    const msg=[r.add?`+${r.add} dans les courses`:"",r.rm?`−${r.rm} retiré${r.rm>1?"s":""}`:""]
      .filter(Boolean).join(" · ");
    return msg?toast("Repas enregistré · "+msg):toast("Repas enregistré");
  }
  if(t.dataset.resetmeal){
    delete custom[mkey(edit.d,edit.i)]; S.set("custom",custom);
    const dd=edit.d, ii=edit.i; edit=null;
    autoSync(dd); return openEditor(dd,ii);
  }
  if(t.dataset.cartmeal){
    const n=toCart(edit.draft.map(x=>({n:x.n,q:dispQ(x)})));
    return toast(n?n+" article"+(n>1?"s":"")+" ajouté"+(n>1?"s":"")+" à ta liste":"Déjà dans ta liste");
  }
  if(t.dataset.cart){
    const d=t.dataset.cart, r=dayInfo(d).r;
    let all=[];
    MEALS[d].forEach((m,i)=>{
      const mo=mealOf(d,i);
      mo.items.forEach(x=>all.push({n:x.n,q:mo.custom?x.q:scaleQ(x.q,r)}));
    });
    const n=toCart(all);
    return toast(n?n+" article"+(n>1?"s":"")+" ajouté"+(n>1?"s":"")+" à ta liste":"Déjà dans ta liste");
  }
  if(t.dataset.month!==undefined){ month=+t.dataset.month; S.set("month",month); return refresh(); }
  if(t.dataset.set){
    const v=t.dataset.val;
    P[t.dataset.set]= t.dataset.set==="sex" ? v : parseFloat(v);
    S.set("profile",P); return refresh();
  }
  if(t.id==="pSave"){
    const num=id=>{ const el=document.getElementById(id);
      const v=parseFloat((el?el.value:"").replace(",",".")); return isNaN(v)?null:v; };
    const age=num("fAge"), hh=num("fH"), ww=num("fW"), gg=num("fG");
    if(age!==null) P.age=Math.min(100,Math.max(14,Math.round(age)));
    if(hh!==null)  P.height=Math.min(230,Math.max(120,Math.round(hh)));
    if(ww!==null){ if(!weights.length) P.start=ww; P.weight=ww; }
    if(gg!==null)  P.goal=gg;
    S.set("profile",P);
    const btn=document.getElementById("pSave");
    refresh();
    const nb=document.getElementById("pSave");
    if(nb){ nb.textContent="Enregistré ✓"; setTimeout(()=>{ if(document.getElementById("pSave"))
      document.getElementById("pSave").textContent="Enregistrer"; },1600); }
    return;
  }
  if(t.id==="gAdd"){
    const el=document.getElementById("gIn"); const v=(el.value||"").trim();
    if(!v) return;
    list.push({id:"u"+Date.now(),n:v,q:"",c:"Divers",o:"user",done:false});
    S.set("list",list); el.value=""; return refresh();
  }
  if(t.dataset.m){ const [dd,ii]=t.dataset.m.split("-"); toggleMealLog(dd,+ii); return refresh(); }
  if(t.dataset.day){ openDay=(openDay===t.dataset.day)?null:t.dataset.day; return refresh(); }
  if(t.dataset.ex){ openEx=(openEx===t.dataset.ex)?null:t.dataset.ex; return refresh(); }
  if(t.dataset.del){ weights=weights.filter(x=>x.date!==t.dataset.del); S.set("weights",weights); return refresh(); }
  if(t.id==="wAdd"){
    const v=parseFloat((document.getElementById("wIn").value||"").replace(",","."));
    if(!v||v<40||v>200) return;
    const date=new Date().toISOString().slice(0,10);
    weights=weights.filter(x=>x.date!==date).concat([{date,weight:v}]).sort((a,b)=>a.date.localeCompare(b.date));
    S.set("weights",weights); P.weight=v; S.set("profile",P); return refresh();
  }
});
document.addEventListener("input",e=>{
  if(e.target.id==="jq"){
    jq=e.target.value;
    const box=document.getElementById("jres");
    if(box) box.innerHTML=jq?logResults(jq):"";
    return;
  }
  if(e.target.id==="fq"&&edit){
    edit.q=e.target.value;
    const box=document.getElementById("fres");
    if(box) box.innerHTML=foodResults(edit.q);
  }
});
document.addEventListener("change",e=>{
  if(e.target.classList&&e.target.classList.contains("gi")&&e.target.dataset.lgi!==undefined){
    const j=+e.target.dataset.lgi, v=parseFloat((e.target.value||"").replace(",","."));
    const a=dayLog().slice();
    if(!isNaN(v)&&v>0&&a[j]){ const u=unitOf(a[j].n); a[j].g=Math.max(1,Math.min(5000,toG(v,u))); saveLog(a); }
    return refresh();
  }
  if(e.target.classList&&e.target.classList.contains("gi")&&edit){
    const j=+e.target.dataset.gi, v=parseFloat((e.target.value||"").replace(",","."));
    if(!isNaN(v)&&v>0){
      const u=unitOf(edit.draft[j].n);
      edit.draft[j].g=Math.max(1,Math.min(5000,toG(v,u)));
    }
    refresh();
  }
});
function toast(msg){
  let el=document.getElementById("toast");
  if(!el){ el=document.createElement("div"); el.id="toast"; document.body.appendChild(el); }
  el.textContent=msg; el.className="show";
  clearTimeout(toast._t); toast._t=setTimeout(()=>{ el.className=""; },2200);
}
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&tab) goHome();
  if(e.key==="Enter"&&e.target.id==="gIn"){ e.preventDefault(); document.getElementById("gAdd").click(); }
});

migrateMeals();
goHome();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
