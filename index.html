:root{

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:80px;}
header{background:var(--blueprintDeep);border-bottom:4px dashed var(--orange);
  padding:calc(env(safe-area-inset-top) + 18px) 20px 18px;}
.badge{display:inline-block;background:var(--orange);color:#fff;font-size:11px;font-weight:600;
  padding:4px 8px;border-radius:4px;font-family:ui-monospace,Menlo,Consolas,monospace;}
.sub{color:var(--orangeSoft);font-size:11px;margin-left:8px;font-family:ui-monospace,Menlo,Consolas,monospace;}
h1{color:#FBF8EE;font-size:28px;margin:8px 0 2px;text-transform:uppercase;letter-spacing:-.5px;line-height:1;}
.today{color:var(--orangeSoft);font-size:13px;margin:0;}
main{padding:16px 14px;max-width:560px;margin:0 auto;}
h2{font-size:18px;text-transform:uppercase;margin:0 0 4px;letter-spacing:.3px;}
.note{color:var(--inkSoft);font-size:11px;margin:0 0 12px;}
.card{background:var(--card);border:1px solid var(--steel);border-radius:10px;overflow:hidden;margin-bottom:12px;}
.cardhead{background:var(--paperDark);padding:9px 14px;font-size:13px;font-weight:700;
  text-transform:uppercase;letter-spacing:.5px;color:var(--blueprintDeep);
  display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.cardhead.today{background:var(--orangeSoft);}
.row{display:flex;align-items:flex-start;gap:12px;padding:10px 14px;border-top:1px solid var(--paperDark);cursor:pointer;}
.row:first-child{border-top:none;}
.box{width:20px;height:20px;border-radius:5px;border:2px solid var(--steel);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;margin-top:2px;}
.box.on{background:var(--green);border-color:var(--green);}
.box.on::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px);}
.done{text-decoration:line-through;color:var(--inkSoft);}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;}
.grow{flex:1;min-width:0;}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.qty{font-size:11px;color:var(--orange);white-space:nowrap;font-family:ui-monospace,Menlo,Consolas,monospace;}
.kcal{font-size:11px;color:var(--steel);white-space:nowrap;font-family:ui-monospace,Menlo,Consolas,monospace;}
.mtype{font-size:11px;font-weight:600;color:var(--blueprint);font-family:ui-monospace,Menlo,Consolas,monospace;}
.total{background:var(--paperDark);padding:10px 14px;display:flex;justify-content:space-between;
  font-weight:700;text-transform:uppercase;font-size:13px;color:var(--blueprintDeep);border-top:1px solid var(--steel);}
.total span:last-child{color:var(--orange);font-family:ui-monospace,Menlo,Consolas,monospace;}
.bar{background:var(--paperDark);height:10px;border-radius:99px;overflow:hidden;}
.bar>div{height:100%;border-radius:99px;transition:width .3s;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;}
.stat{background:var(--card);border:1px solid var(--steel);border-radius:10px;padding:12px 6px;text-align:center;}
.stat b{display:block;font-size:18px;font-family:ui-monospace,Menlo,Consolas,monospace;}
.stat span{font-size:11px;color:var(--inkSoft);}
.dark{background:var(--blueprintDeep);color:#fff;border-radius:10px;padding:18px;display:flex;
  justify-content:space-between;margin-bottom:12px;}
.dark p{margin:0;}
.dark .lbl{color:var(--orangeSoft);font-size:11px;}
.dark .val{font-size:28px;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600;}
.ex{padding:0 14px 14px;font-size:14px;line-height:1.55;}
.ex .tip{color:var(--blueprint);font-size:12px;margin-top:8px;font-family:ui-monospace,Menlo,Consolas,monospace;}
ul.plain{margin:0;padding:0;list-style:none;}
.exline{font-size:13px;padding:4px 14px;font-family:ui-monospace,Menlo,Consolas,monospace;}
.exline.hd{color:var(--blueprint);font-weight:600;}
input{flex:1;border:1px solid var(--steel);background:var(--paper);border-radius:6px;
  padding:10px;font-size:14px;font-family:ui-monospace,Menlo,Consolas,monospace;outline:none;min-width:0;}
button.add{background:var(--orange);color:#fff;border:none;border-radius:6px;padding:10px 16px;
  font-size:14px;font-weight:600;}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--blueprintDeep);
  border-top:3px solid var(--orange);display:flex;padding:6px 2px calc(env(safe-area-inset-bottom) + 6px);}
nav button{flex:1;background:none;border:none;color:#B9C4CC;display:flex;flex-direction:column;
  align-items:center;gap:3px;padding:4px 0;font-size:10px;font-family:ui-monospace,Menlo,Consolas,monospace;}
nav button.on{color:var(--orange);}
nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;}
.del{background:none;border:none;color:var(--inkSoft);font-size:16px;padding:0 4px;}
.chart{background:var(--card);border:1px solid var(--steel);border-radius:10px;padding:12px;margin-bottom:12px;}
.catlabel{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
  color:var(--blueprintDeep);margin:16px 0 8px;}
</style>
</head>

        desc: "Appui sur avant-bras et pointes de pieds, corps parfaitement aligné de la tête aux talons, comme une planche rigide.",
        tip: "Contracte les abdos et les fessiers pour éviter que le bassin ne s'affaisse.",
      },
      {
        name: "Gainage latéral",
        desc: "Appui sur un avant-bras et le côté du pied, corps aligné, hanche décollée du sol, bras libre tendu vers le plafond.",
        tip: "Ne laisse pas la hanche retomber — c'est elle qui travaille.",
      },
    ],
  },
  {
    category: "Cardio",
    exercises: [
      {
        name: "Sprint / marche (fractionné)",
        desc: "Alterne une phase de course rapide (sprint) et une phase de marche ou course lente pour récupérer, sur la durée indiquée.",
        tip: "Le sprint doit être proche de ton effort maximal — c'est l'intensité qui fait l'efficacité du fractionné.",
      },
      {
        name: "Shadow boxing",
        desc: "Enchaîne des combinaisons de coups de poing dans le vide (jab, direct, crochet) en te déplaçant, comme face à un adversaire imaginaire.",
        tip: "Garde les mains hautes et le buste mobile même sans adversaire réel.",
      },
      {
        name: "Échelle de rythme (footwork)",
        desc: "Enchaîne des appuis rapides et précis à travers une échelle de rythme au sol pour travailler la vitesse et la coordination des appuis.",
        tip: "Reste sur la pointe des pieds, regard devant toi plutôt que sur tes pieds.",
      },
      {
        name: "Corde à sauter",
        desc: "Saute avec un léger rebond, poignets qui font tourner la corde plutôt que les bras entiers.",
        tip: "Petits sauts, proches du sol — inutile de sauter haut.",
      },
    ],
  },
  {
    category: "Étirements & mobilité",
    exercises: [
      {
        name: "Marche rapide",
        desc: "Marche à un rythme soutenu qui accélère légèrement la respiration, sans passer en course.",
        tip: "Bon moyen de récupérer activement entre deux séances plus intenses.",
      },
      {
        name: "Étirements ischio-jambiers",
        desc: "Jambe tendue devant toi (assis ou debout), penche le buste vers l'avant en gardant le dos droit jusqu'à sentir l'étirement à l'arrière de la cuisse.",
        tip: "Ne force jamais dans la douleur — l'étirement doit rester confortable.",
      },
      {
        name: "Étirements quadriceps",
        desc: "Debout, attrape ta cheville derrière toi et ramène le talon vers la fesse, genoux alignés.",
        tip: "Prends appui sur un mur ou une chaise si l'équilibre est difficile.",
      },
      {
        name: "Étirements dos et épaules",
        desc: "Bras tendu devant toi, ramène-le vers la poitrine avec l'autre bras pour étirer l'épaule ; pour le dos, arrondis-le doucement en position à quatre pattes (chat/vache).",
        tip: "Respire lentement et profondément pendant chaque étirement.",
      },
      {
        name: "Mobilité articulaire",
        desc: "Cercles de bras, rotations de hanches, chevilles et poignets pour préparer ou détendre les articulations.",
        tip: "Idéal en échauffement avant une séance ou en récupération après.",
      },
    ],
  },
];


const DAYS = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const START_WEIGHT = 82, GOAL_WEIGHT = 75, GOAL_LABEL = "fin septembre";

// ---- stockage local (100% sur le téléphone) ----
const S = {
  get(k, d){ try { const v = localStorage.getItem("c75:"+k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem("c75:"+k, JSON.stringify(v)); } catch(e){} }
};
let groceries = S.get("groceries", {});
let meals     = S.get("meals", {});
let workouts  = S.get("workouts", {});
let weights   = S.get("weights", []);
let tab = "chantier";
let openDay = null, openEx = null;

function todayName(){ const m=[6,0,1,2,3,4,5]; return DAYS[m[new Date().getDay()]]; }
const TODAY = todayName();
document.getElementById("todayName").textContent = TODAY;
document.getElementById("goalLabel").textContent = "objectif " + GOAL_LABEL;
openDay = TODAY;

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const kcalOf = m => m.items.reduce((s,i)=>s+(i.k||0),0);
const dayKcal = d => MEALS[d].reduce((s,m)=>s+kcalOf(m),0);

function pcts(){
  const totG = GROCERIES.reduce((s,c)=>s+c.items.length,0);
  const g = totG ? Math.round(Object.values(groceries).filter(Boolean).length/totG*100) : 0;
  const m = Math.round(Object.values(meals).filter(Boolean).length/(DAYS.length*4)*100);
  const w = Math.round(Object.values(workouts).filter(Boolean).length/DAYS.length*100);
  return {g,m,w,all:Math.round((g+m+w)/3)};
}
function currentWeight(){ return weights.length ? weights[weights.length-1].weight : START_WEIGHT; }

// ---- vues ----
function viewChantier(){
  const p = pcts(), cw = currentWeight(), togo = Math.max(0,+(cw-GOAL_WEIGHT).toFixed(1));
  const nw = Object.values(workouts).filter(Boolean).length;
  return `
  <div class="card" style="padding:18px">
    <div class="between" style="margin-bottom:8px">
      <b style="font-size:17px;text-transform:uppercase">Avancement global</b>
      <b class="mono" style="font-size:22px;color:var(--orange)">${p.all}%</b>
    </div>
    <div class="bar"><div style="width:${p.all}%;background:var(--orange)"></div></div>
    <p class="note" style="margin:8px 0 0">Moyenne courses + repas + sport de la semaine</p>
  </div>
  <div class="stats">
    <div class="stat"><b style="color:var(--blueprint)">${p.g}%</b><span>Courses</span></div>
    <div class="stat"><b style="color:var(--green)">${p.m}%</b><span>Repas</span></div>
    <div class="stat"><b style="color:var(--orange)">${p.w}%</b><span>Sport</span></div>
  </div>
  <div class="dark">
    <div><p class="lbl">Poids actuel</p><p class="val">${cw} kg</p></div>
    <div style="text-align:right"><p class="lbl">Reste à perdre</p><p class="val" style="color:var(--orange)">${togo} kg</p></div>
  </div>
  <div class="card" style="padding:14px" class="between">
    <div class="between"><span style="font-size:14px">Séances sport cette semaine</span>
    <b class="mono" style="color:var(--blueprint)">${nw}/7</b></div>
  </div>`;
}

function viewCourses(){
  const p = pcts();
  let h = `<div class="between"><h2>Liste de courses</h2><b class="mono" style="color:var(--blueprint)">${p.g}%</b></div>
  <p class="note">Coche au fur et à mesure dans le magasin.</p>`;
  GROCERIES.forEach(c=>{
    h += `<div class="card"><div class="cardhead" style="cursor:default">${esc(c.category)}</div>`;
    c.items.forEach(it=>{
      const on = groceries[it.id];
      h += `<div class="row" data-g="${it.id}">
        <div class="box ${on?'on':''}"></div>
        <div class="grow between"><span style="font-size:14px" class="${on?'done':''}">${esc(it.name)}</span>
        <span class="qty">${esc(it.qty)}</span></div></div>`;
    });
    h += `</div>`;
  });
  return h;
}

function viewRepas(){
  const p = pcts();
  let h = `<div class="between"><h2>Repas de la semaine</h2><b class="mono" style="color:var(--green)">${p.m}%</b></div>
  <p class="note">Poids à peser cru, avant cuisson. Calories estimées.</p>`;
  DAYS.forEach(d=>{
    const op = openDay===d, td = d===TODAY;
    h += `<div class="card"><div class="cardhead ${td?'today':''}" data-day="${d}">
      <span>${d}${td?" · aujourd'hui":""}</span><span>${op?'−':'+'}</span></div>`;
    if(op){
      MEALS[d].forEach((m,i)=>{
        const k = d+"-"+i, on = meals[k];
        h += `<div class="row" data-m="${k}"><div class="box ${on?'on':''}"></div><div class="grow">
          <div class="between" style="margin-bottom:3px"><span class="mtype">${esc(m.type)}</span>
          <span class="kcal">~${kcalOf(m)} kcal</span></div>`;
        m.items.forEach(ing=>{
          h += `<div class="between"><span style="font-size:14px" class="${on?'done':''}">${esc(ing.n)}</span>
            <span style="display:flex;gap:8px"><span class="qty">${esc(ing.q)}</span>
            <span class="kcal">${ing.k} kcal</span></span></div>`;
        });
        h += `</div></div>`;
      });
      h += `<div class="total"><span>Total du jour</span><span>~${dayKcal(d)} kcal</span></div>`;
    }
    h += `</div>`;
  });
  return h;
}

function viewSport(){
  let h = `<h2>Séances de la semaine</h2><p class="note">Touche un jour pour voir le détail.</p>`;
  DAYS.forEach(d=>{
    const w = WORKOUTS[d], on = workouts[d], op = openDay===d, td = d===TODAY;
    h += `<div class="card"><div class="cardhead ${td?'today':''}" data-day="${d}" style="align-items:flex-start">
      <span style="display:flex;gap:10px;align-items:flex-start">
        <span class="box ${on?'on':''}" data-w="${d}" style="margin-top:0"></span>
        <span><span style="display:block">${d}${td?" · aujourd'hui":""}</span>
        <span style="display:block;font-weight:400;text-transform:none;font-size:13px;margin-top:2px" class="${on?'done':''}">${esc(w.session)}</span></span>
      </span>
      <span style="display:flex;gap:6px;align-items:center;font-weight:400">
        <span class="kcal">${esc(w.duration)}</span><span>${op?'−':'+'}</span></span></div>`;
    if(op){
      h += `<ul class="plain" style="padding:8px 0">`;
      w.exercises.forEach(e=>{
        h += `<li class="exline ${e.trim().endsWith(':')?'hd':''}">${esc(e)}</li>`;
      });
      h += `</ul>`;
    }
    h += `</div>`;
  });
  return h;
}

function chartSVG(){
  const W=320,H=170,pad={l:34,r:10,t:12,b:22};
  const pts=[{d:"Départ",w:START_WEIGHT}].concat(weights.map(x=>({d:x.date.slice(5),w:x.weight})));
  const maxW=Math.max(START_WEIGHT+1,...pts.map(p=>p.w)), minW=Math.min(GOAL_WEIGHT-1,...pts.map(p=>p.w));
  const X=i=>pad.l+(pts.length<2?0:i*(W-pad.l-pad.r)/(pts.length-1));
  const Y=v=>pad.t+(maxW-v)/(maxW-minW||1)*(H-pad.t-pad.b);
  let g="";
  [minW,(minW+maxW)/2,maxW].forEach(v=>{
    g+=`<line x1="${pad.l}" y1="${Y(v)}" x2="${W-pad.r}" y2="${Y(v)}" stroke="#E7E0CC"/>
        <text x="4" y="${Y(v)+4}" font-size="9" fill="#5B564A">${v.toFixed(0)}</text>`;
  });
  g+=`<line x1="${pad.l}" y1="${Y(GOAL_WEIGHT)}" x2="${W-pad.r}" y2="${Y(GOAL_WEIGHT)}"
      stroke="#4C7A52" stroke-dasharray="4 4"/>
      <text x="${W-pad.r}" y="${Y(GOAL_WEIGHT)-4}" font-size="9" fill="#4C7A52" text-anchor="end">Objectif 75 kg</text>`;
  if(pts.length>1){
    g+=`<polyline fill="none" stroke="#C1560C" stroke-width="2.5" stroke-linejoin="round"
        points="${pts.map((p,i)=>X(i)+","+Y(p.w)).join(" ")}"/>`;
  }
  pts.forEach((p,i)=>{
    g+=`<circle cx="${X(i)}" cy="${Y(p.w)}" r="3.5" fill="#C1560C"/>`;
    if(i===0||i===pts.length-1)
      g+=`<text x="${X(i)}" y="${H-6}" font-size="9" fill="#5B564A" text-anchor="middle">${esc(p.d)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="170">${g}</svg>`;
}

function viewPoids(){
  const cw=currentWeight(), togo=Math.max(0,+(cw-GOAL_WEIGHT).toFixed(1));
  let h = `<h2>Suivi du poids</h2><p class="note">Pèse-toi le matin à jeun, toujours dans les mêmes conditions.</p>
  <div class="card" style="padding:12px;display:flex;gap:8px">
    <input id="wIn" type="text" inputmode="decimal" placeholder="Pesée du jour (kg)">
    <button class="add" id="wAdd">Ajouter</button></div>
  <div class="chart">${chartSVG()}</div>
  <div class="stats" style="grid-template-columns:repeat(2,1fr)">
    <div class="stat"><b style="color:var(--blueprint)">${cw} kg</b><span>Poids actuel</span></div>
    <div class="stat"><b style="color:var(--orange)">${togo} kg</b><span>Reste à perdre</span></div></div>`;
  if(weights.length){
    h += `<div class="card"><div class="cardhead" style="cursor:default">Historique</div>`;
    weights.slice().reverse().forEach(w=>{
      h += `<div class="row" style="cursor:default"><div class="grow between">
        <span class="mono" style="font-size:14px">${esc(w.date)}</span>
        <span style="display:flex;gap:10px;align-items:center">
        <b class="mono" style="color:var(--blueprint);font-size:14px">${w.weight} kg</b>
        <button class="del" data-del="${w.date}">✕</button></span></div></div>`;
    });
    h += `</div>`;
  }
  return h;
}

function viewGuide(){
  let h = `<h2>Guide des exercices</h2><p class="note">Comment bien exécuter chaque mouvement.</p>`;
  EXERCISE_GUIDE.forEach(cat=>{
    h += `<div class="catlabel">${esc(cat.category)}</div>`;
    cat.exercises.forEach(ex=>{
      const key = cat.category+"|"+ex.name, op = openEx===key;
      h += `<div class="card"><div class="cardhead" data-ex="${esc(key)}"
        style="${op?'background:var(--orangeSoft)':'background:transparent'};text-transform:none;font-size:14px">
        <span>${esc(ex.name)}</span><span>${op?'−':'+'}</span></div>`;
      if(op) h += `<div class="ex"><p style="margin:10px 0 0">${esc(ex.desc)}</p>
        <p class="tip">💡 ${esc(ex.tip)}</p></div>`;
      h += `</div>`;
    });
  });
  return h;
}

// ---- navigation ----
const ICONS = {
  chantier:'<path d="M9 2h6v4H9z"/><path d="M4 6h16v16H4z"/><path d="M8 12h8M8 16h5"/>',
  courses:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11L21 7H6"/>',
  repas:'<path d="M4 3v8a2 2 0 004 0V3M6 11v10"/><path d="M17 3c-1.5 2-2 4-2 6s.5 3 2 3 2-1 2-3-.5-4-2-6zM17 12v9"/>',
  sport:'<path d="M6 6v12M18 6v12M3 9v6M21 9v6M6 12h12"/>',
  poids:'<path d="M12 3a4 4 0 100 8 4 4 0 000-8z"/><path d="M4 21V9a3 3 0 013-3h10a3 3 0 013 3v12z"/>',
  guide:'<path d="M4 4h7a2 2 0 012 2v14a2 2 0 00-2-2H4z"/><path d="M20 4h-7a2 2 0 00-2 2v14a2 2 0 012-2h7z"/>'
};
const TABS = [["chantier","Chantier"],["courses","Courses"],["repas","Repas"],
  ["sport","Sport"],["poids","Poids"],["guide","Guide"]];

function renderNav(){
  document.getElementById("nav").innerHTML = TABS.map(([id,l])=>
    `<button class="${tab===id?'on':''}" data-tab="${id}">
      <svg viewBox="0 0 24 24">${ICONS[id]}</svg><span>${l}</span></button>`).join("");
}
function render(){
  const v = {chantier:viewChantier,courses:viewCourses,repas:viewRepas,
    sport:viewSport,poids:viewPoids,guide:viewGuide}[tab];
  document.getElementById("app").innerHTML = v();
  renderNav();
  window.scrollTo(0,0);
}

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-tab],[data-g],[data-m],[data-w],[data-day],[data-ex],[data-del],#wAdd");
  if(!t) return;
  if(t.dataset.tab){ tab = t.dataset.tab; if(tab==="repas"||tab==="sport") openDay = openDay||TODAY; return render(); }
  if(t.dataset.g){ groceries[t.dataset.g] = !groceries[t.dataset.g]; S.set("groceries",groceries); return render(); }
  if(t.dataset.m){ meals[t.dataset.m] = !meals[t.dataset.m]; S.set("meals",meals); return render(); }
  if(t.dataset.w){ e.stopPropagation(); workouts[t.dataset.w] = !workouts[t.dataset.w]; S.set("workouts",workouts); return render(); }
  if(t.dataset.day){ openDay = (openDay===t.dataset.day)?null:t.dataset.day; return render(); }
  if(t.dataset.ex){ openEx = (openEx===t.dataset.ex)?null:t.dataset.ex; return render(); }
  if(t.dataset.del){ weights = weights.filter(w=>w.date!==t.dataset.del); S.set("weights",weights); return render(); }
  if(t.id==="wAdd"){
    const val = parseFloat((document.getElementById("wIn").value||"").replace(",","."));
    if(!val||val<40||val>200) return;
    const date = new Date().toISOString().slice(0,10);
    weights = weights.filter(w=>w.date!==date).concat([{date,weight:val}]).sort((a,b)=>a.date.localeCompare(b.date));
    S.set("weights",weights); return render();
  }
});

render();
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
</body>
