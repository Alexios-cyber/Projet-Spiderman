<meta name="theme-color" content="#0D0A18">
<title>Vertigo</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#0D0A18; --surf:#171232; --surf2:#221A48; --line:#2E2559;
  --red:#FF2E55; --cyan:#22E0D6; --lime:#B8FF3C;
  --text:#F3F0FF; --muted:#9A93C4; --ok:#3DDC97;
  --disp:'Anton',Impact,sans-serif;
  --body:'Space Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);
  overscroll-behavior-y:none;}
body{min-height:100vh;}
button{font-family:inherit;color:inherit;}

/* ---------- ACCUEIL ---------- */
#home{min-height:100vh;padding:calc(env(safe-area-inset-top) + 8px) 18px calc(env(safe-area-inset-bottom) + 28px);
  position:relative;overflow:hidden;}
#web{position:absolute;top:-40px;left:50%;transform:translateX(-50%);width:190%;max-width:760px;
  opacity:.5;pointer-events:none;}
.hero{position:relative;text-align:center;padding-top:26px;}
.hero img{width:96px;filter:drop-shadow(0 0 22px rgba(255,46,85,.45));
  animation:drop .9s cubic-bezier(.2,.8,.2,1) both;}
@keyframes drop{from{transform:translateY(-26px);opacity:0}to{transform:none;opacity:1}}
.hero h1{font-family:var(--disp);font-size:clamp(48px,17vw,74px);margin:10px 0 0;
  letter-spacing:2px;line-height:.9;text-transform:uppercase;
  background:linear-gradient(180deg,#fff 30%,var(--red));-webkit-background-clip:text;
  background-clip:text;color:transparent;}
.tag{font-family:var(--mono);font-size:11px;color:var(--cyan);letter-spacing:2.5px;
  text-transform:uppercase;margin:6px 0 0;}

/* jauge + poids */
.dash{position:relative;display:flex;align-items:center;gap:16px;
  background:linear-gradient(135deg,var(--surf),rgba(34,26,72,.55));
  border:1px solid var(--line);border-radius:20px;padding:16px;margin:22px 0 18px;}
.ring{position:relative;width:82px;height:82px;flex-shrink:0;}
.ring svg{transform:rotate(-90deg);}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:18px;font-weight:700;}
.dash .kg{font-family:var(--disp);font-size:40px;line-height:.95;letter-spacing:1px;}
.dash .kg small{font-size:16px;color:var(--muted);}
.dash .lbl{font-family:var(--mono);font-size:10px;color:var(--muted);
  letter-spacing:1.6px;text-transform:uppercase;margin:0 0 2px;}
.dash .togo{font-family:var(--mono);font-size:12px;color:var(--red);margin:6px 0 0;font-weight:700;}

/* menu */
.menu{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.tile{background:var(--surf);border:1px solid var(--line);border-radius:18px;
  padding:16px 14px;text-align:left;position:relative;overflow:hidden;
  transition:transform .12s,border-color .12s;display:block;width:100%;}
.tile:active{transform:scale(.96);border-color:var(--red);}
.tile.wide{grid-column:span 2;display:flex;align-items:center;gap:14px;}
.tile .ic{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;
  justify-content:center;margin-bottom:10px;}
.tile.wide .ic{margin:0;}
.tile .ic svg{width:19px;height:19px;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.tile h3{font-family:var(--disp);font-size:19px;margin:0;letter-spacing:1px;text-transform:uppercase;}
.tile p{font-family:var(--mono);font-size:11px;color:var(--muted);margin:3px 0 0;}
.tile .arrow{position:absolute;right:13px;bottom:13px;color:var(--line);font-size:15px;}
.tile.wide .arrow{position:static;margin-left:auto;}

/* ---------- SECTIONS ---------- */
#page{display:none;min-height:100vh;padding-bottom:40px;}
.top{position:sticky;top:0;z-index:20;background:rgba(13,10,24,.92);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:12px;}
.back{background:var(--surf);border:1px solid var(--line);border-radius:11px;
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.back svg{width:17px;height:17px;stroke:var(--text);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.top h2{font-family:var(--disp);font-size:23px;margin:0;letter-spacing:1.2px;text-transform:uppercase;}
.top .pc{margin-left:auto;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--cyan);}
.wrap{padding:16px 14px;max-width:560px;margin:0 auto;}
.note{font-family:var(--mono);font-size:11px;color:var(--muted);margin:0 0 14px;line-height:1.5;}

.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;
  overflow:hidden;margin-bottom:12px;}
.chead{background:var(--surf2);padding:12px 14px;display:flex;justify-content:space-between;
  align-items:center;gap:10px;font-family:var(--disp);font-size:15px;letter-spacing:1px;
  text-transform:uppercase;}
.chead.now{background:linear-gradient(90deg,rgba(255,46,85,.22),transparent);
  border-left:3px solid var(--red);}
.chead .pl{font-family:var(--mono);color:var(--muted);font-size:15px;font-weight:700;}
.row{display:flex;gap:12px;padding:11px 14px;border-top:1px solid var(--line);align-items:flex-start;}
.box{width:21px;height:21px;border-radius:7px;border:2px solid var(--line);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;margin-top:1px;transition:.15s;}
.box.on{background:var(--ok);border-color:var(--ok);}
.box.on::after{content:"";width:5px;height:9px;border:solid var(--bg);border-width:0 2.5px 2.5px 0;
  transform:rotate(45deg) translate(-1px,-1px);}
.done{text-decoration:line-through;color:var(--muted);}
.grow{flex:1;min-width:0;}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.nm{font-size:14px;line-height:1.45;}
.qty{font-family:var(--mono);font-size:11px;color:var(--cyan);white-space:nowrap;}
.kcal{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;}
.mtype{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--red);
  letter-spacing:1.4px;text-transform:uppercase;}
.total{background:var(--surf2);padding:12px 14px;display:flex;justify-content:space-between;
  font-family:var(--disp);font-size:15px;letter-spacing:1px;text-transform:uppercase;
  border-top:1px solid var(--line);}
.total span:last-child{font-family:var(--mono);color:var(--lime);}
.exline{font-family:var(--mono);font-size:12.5px;padding:5px 14px;line-height:1.5;color:var(--text);}
.exline.hd{color:var(--cyan);font-weight:700;}
.ex{padding:0 14px 15px;}
.ex p{font-size:14px;line-height:1.6;margin:12px 0 0;}
.ex .tip{font-family:var(--mono);font-size:12px;color:var(--lime);margin-top:10px;line-height:1.5;}
.cat{font-family:var(--disp);font-size:14px;letter-spacing:2px;text-transform:uppercase;
  color:var(--muted);margin:20px 0 10px;padding-left:2px;}
.cat:first-child{margin-top:4px;}
.duration{font-family:var(--mono);font-size:11px;color:var(--muted);}
.sess{font-family:var(--body);font-size:13px;text-transform:none;letter-spacing:0;
  font-weight:400;color:var(--muted);margin-top:3px;display:block;}

.wbar{display:flex;gap:9px;margin-bottom:14px;}
input{flex:1;min-width:0;background:var(--surf);border:1px solid var(--line);color:var(--text);
  border-radius:13px;padding:13px;font-family:var(--mono);font-size:15px;outline:none;}
input:focus{border-color:var(--red);}
input::placeholder{color:var(--muted);}
.addb{background:var(--red);border:none;border-radius:13px;padding:0 20px;
  font-family:var(--disp);font-size:15px;letter-spacing:1px;text-transform:uppercase;color:#fff;}
.chart{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:14px 8px;margin-bottom:12px;}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:12px;}
.stat{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center;}
.stat b{display:block;font-family:var(--disp);font-size:24px;letter-spacing:1px;}
.stat span{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase;}
.del{background:none;border:none;color:var(--muted);font-size:15px;padding:0 2px;}
ul.plain{margin:0;padding:0;list-style:none;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>

const DAYS = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const START_WEIGHT = 82, GOAL_WEIGHT = 75, GOAL_LABEL = "fin septembre";

const S = {
  get(k,d){ try{ const v=localStorage.getItem("c75:"+k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem("c75:"+k,JSON.stringify(v)); }catch(e){} }
};
let groceries=S.get("groceries",{}), meals=S.get("meals",{}),
    workouts=S.get("workouts",{}), weights=S.get("weights",[]);
let tab=null, openDay=null, openEx=null;

const DAYMAP=[6,0,1,2,3,4,5];
const TODAY=DAYS[DAYMAP[new Date().getDay()]];
openDay=TODAY;

const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const kcalOf=m=>m.items.reduce((s,i)=>s+(i.k||0),0);
const dayKcal=d=>MEALS[d].reduce((s,m)=>s+kcalOf(m),0);
const cw=()=>weights.length?weights[weights.length-1].weight:START_WEIGHT;

function pcts(){
  const tg=GROCERIES.reduce((s,c)=>s+c.items.length,0);
  const g=tg?Math.round(Object.values(groceries).filter(Boolean).length/tg*100):0;
  const m=Math.round(Object.values(meals).filter(Boolean).length/(DAYS.length*4)*100);
  const w=Math.round(Object.values(workouts).filter(Boolean).length/DAYS.length*100);
  return {g,m,w,all:Math.round((g+m+w)/3)};
}

/* ---- toile d'araignée décorative ---- */
(function(){
  const cx=200,cy=10,R=340,rays=11,rings=6;
  let p="";
  for(let i=0;i<rays;i++){
    const a=Math.PI*(0.06+0.88*i/(rays-1));
    p+=`<line x1="${cx}" y1="${cy}" x2="${(cx+Math.cos(a)*R).toFixed(1)}" y2="${(cy+Math.sin(a)*R).toFixed(1)}"/>`;
  }
  for(let r=1;r<=rings;r++){
    const rad=R*r/rings; let pts=[];
    for(let i=0;i<rays;i++){
      const a=Math.PI*(0.06+0.88*i/(rays-1));
      pts.push(`${(cx+Math.cos(a)*rad).toFixed(1)},${(cy+Math.sin(a)*rad).toFixed(1)}`);
    }
    p+=`<polyline points="${pts.join(" ")}"/>`;
  }
  document.getElementById("web").innerHTML=
    `<g fill="none" stroke="#2E2559" stroke-width="1">${p}</g>`;
})();

function chartSVG(){
  const W=320,H=180,pad={l:32,r:12,t:14,b:24};
  const pts=[{d:"Départ",w:START_WEIGHT}].concat(weights.map(x=>({d:x.date.slice(5),w:x.weight})));
  const mx=Math.max(START_WEIGHT+1,...pts.map(p=>p.w)), mn=Math.min(GOAL_WEIGHT-1,...pts.map(p=>p.w));
  const X=i=>pad.l+(pts.length<2?0:i*(W-pad.l-pad.r)/(pts.length-1));
  const Y=v=>pad.t+(mx-v)/(mx-mn||1)*(H-pad.t-pad.b);
  let g="";
  [mn,(mn+mx)/2,mx].forEach(v=>{
    g+=`<line x1="${pad.l}" y1="${Y(v)}" x2="${W-pad.r}" y2="${Y(v)}" stroke="#2E2559"/>
        <text x="3" y="${Y(v)+4}" font-size="9" fill="#9A93C4" font-family="monospace">${v.toFixed(0)}</text>`;
  });
  g+=`<line x1="${pad.l}" y1="${Y(GOAL_WEIGHT)}" x2="${W-pad.r}" y2="${Y(GOAL_WEIGHT)}"
      stroke="#B8FF3C" stroke-dasharray="5 4"/>
      <text x="${W-pad.r}" y="${Y(GOAL_WEIGHT)-5}" font-size="9" fill="#B8FF3C"
      text-anchor="end" font-family="monospace">OBJECTIF 75</text>`;
  if(pts.length>1)
    g+=`<polyline fill="none" stroke="#FF2E55" stroke-width="2.6" stroke-linejoin="round"
        stroke-linecap="round" points="${pts.map((p,i)=>X(i)+","+Y(p.w)).join(" ")}"/>`;
  pts.forEach((p,i)=>{
    g+=`<circle cx="${X(i)}" cy="${Y(p.w)}" r="3.6" fill="#FF2E55"/>`;
    if(i===0||i===pts.length-1)
      g+=`<text x="${X(i)}" y="${H-7}" font-size="9" fill="#9A93C4" text-anchor="middle"
          font-family="monospace">${esc(p.d)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="180">${g}</svg>`;
}

function vPoids(){
  const w=cw(), togo=Math.max(0,+(w-GOAL_WEIGHT).toFixed(1));

/* ---- navigation ---- */
const VIEWS={courses:vCourses,repas:vRepas,sport:vSport,poids:vPoids,guide:vGuide};
const home=document.getElementById("home"), page=document.getElementById("page");

function go(k){
  tab=k;
  const p=pcts();
  document.getElementById("ptitle").textContent=TABS[k].t;
  document.getElementById("ppct").textContent=
    k==="courses"?p.g+"%": k==="repas"?p.m+"%": k==="sport"?p.w+"%":"";
  document.getElementById("app").innerHTML=VIEWS[k]();
  home.style.display="none"; page.style.display="block";
  window.scrollTo(0,0);
}
function goHome(){
  tab=null; renderHome();
  page.style.display="none"; home.style.display="block";
  window.scrollTo(0,0);
}
function refresh(){ if(tab) go(tab); else renderHome(); }

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-go],[data-g],[data-m],[data-w],[data-day],[data-ex],[data-del],#back,#wAdd");
  if(!t) return;
  if(t.id==="back") return goHome();
  if(t.dataset.go) return go(t.dataset.go);
  if(t.dataset.w){ e.stopPropagation(); workouts[t.dataset.w]=!workouts[t.dataset.w]; S.set("workouts",workouts); return refresh(); }
  if(t.dataset.g){ groceries[t.dataset.g]=!groceries[t.dataset.g]; S.set("groceries",groceries); return refresh(); }
  if(t.dataset.m){ meals[t.dataset.m]=!meals[t.dataset.m]; S.set("meals",meals); return refresh(); }
  if(t.dataset.day){ openDay=(openDay===t.dataset.day)?null:t.dataset.day; return refresh(); }
  if(t.dataset.ex){ openEx=(openEx===t.dataset.ex)?null:t.dataset.ex; return refresh(); }
  if(t.dataset.del){ weights=weights.filter(x=>x.date!==t.dataset.del); S.set("weights",weights); return refresh(); }
  if(t.id==="wAdd"){
    const v=parseFloat((document.getElementById("wIn").value||"").replace(",","."));
    if(!v||v<40||v>200) return;
    const date=new Date().toISOString().slice(0,10);
    weights=weights.filter(x=>x.date!==date).concat([{date,weight:v}]).sort((a,b)=>a.date.localeCompare(b.date));
    S.set("weights",weights); return refresh();
  }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&tab) goHome(); });

goHome();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
